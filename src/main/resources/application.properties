spring.application.name=products-api
spring.data.mongodb.uri=${SPRING_MONGO_URI}
spring.data.mongodb.database=productsDB
# Create unique username index and Session TTL index (expiresAt, expireAfterSeconds=0)
spring.data.mongodb.auto-index-creation=true

spring.security.filter.order=10

spring.main.allow-circular-references=true

# Sized for APK uploads (POST /app/releases); image uploads keep their own limits in ImageService.
spring.servlet.multipart.max-file-size=110MB
spring.servlet.multipart.max-request-size=111MB

# Auth session lifetime before expiresAt; Mongo TTL removes documents when expiresAt is reached
app.session.ttl-days=30

# In-app APK hosting (GET /app/latest, GET /app/download, POST /app/releases).
# Set APP_RELEASES_DEPLOY_TOKEN on the server; empty rejects every upload.
app.releases.path=data/app-releases
app.releases.max-size-bytes=104857600
app.releases.deploy-token=${APP_RELEASES_DEPLOY_TOKEN:}
