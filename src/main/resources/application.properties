spring.application.name=products-api
spring.data.mongodb.uri=${SPRING_MONGO_URI}
spring.data.mongodb.database=productsDB
# Create unique username index and Session TTL index (expiresAt, expireAfterSeconds=0)
spring.data.mongodb.auto-index-creation=true

spring.security.filter.order=10

spring.main.allow-circular-references=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Auth session lifetime before expiresAt; Mongo TTL removes documents when expiresAt is reached
app.session.ttl-days=30
