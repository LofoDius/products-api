# Flapdoodle embedded Mongo auto-configures the connection when on the test classpath.
# Override production `${SPRING_MONGO_URI}` so the context can start without that env var.
spring.data.mongodb.uri=mongodb://localhost:27017/productsDB-test
spring.data.mongodb.database=productsDB-test
spring.data.mongodb.auto-index-creation=true
spring.main.allow-circular-references=true
app.session.ttl-days=30
de.flapdoodle.mongodb.embedded.version=7.0.0
